name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Read the repo, mint the Pages deployment token, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued runs are not cancelled, so a push that lands
# mid-deploy still ships rather than being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck

      - name: Build static export
        env:
          # Project pages are served under /<repo>. Clear this if the site
          # moves to a custom domain at the apex, and update site.url to match.
          NEXT_PUBLIC_BASE_PATH: /zhenwang
        run: npm run build

      # No `enablement: true`. GITHUB_TOKEN is a GitHub App token and cannot
      # create a Pages site — the API answers "Resource not accessible by
      # integration" regardless of the scopes declared above, and tried both
      # while this repo was private and after it was made public. The site has
      # to be created once by hand (README); this step then reads that config.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
