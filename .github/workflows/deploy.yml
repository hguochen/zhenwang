name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Read the repo, mint the Pages deployment token, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued runs are not cancelled, so a push that lands
# mid-deploy still ships rather than being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck

      - name: Build static export
        env:
          # Project pages are served under /<repo>. Clear this if the site
          # moves to a custom domain at the apex, and update site.url to match.
          NEXT_PUBLIC_BASE_PATH: /zhenwang
        run: npm run build

      # Deliberately no `enablement: true`. The workflow token is not permitted
      # to create the Pages site ("Resource not accessible by integration"), so
      # asking it to do so fails the run outright. Pages has to be switched on
      # once by hand — see the README — after which this step just reads the
      # existing config.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
